resources:
  jobs:
    injestion_job:
      name: injestion job
      tasks:
        - task_key: injestion
          notebook_task:
            notebook_path: ../../src/notebooks/injestion.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
