      root_path: /Workspace/Users/rukhsarm2572@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
    permissions:
      - user_name: rukhsarm2572@gmail.com
